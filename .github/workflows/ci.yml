name: public-source-tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # Hermes 0.21.1: the immutable public source used by the plugin tests.
  HERMES_REF: 6494163911460844c73ac76abb5aaa4f967ae14b

jobs:
  source-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.22.0'
      - name: Fetch the tested public Hermes commit
        shell: bash
        run: |
          set -euo pipefail
          [[ "$HERMES_REF" =~ ^[0-9a-fA-F]{40}$ ]]
          mkdir -p .verification/core .verification/home .verification/hermes-home .verification/tmp
          git -C .verification/core init
          git -C .verification/core remote add origin https://github.com/NousResearch/hermes-agent.git
          git -C .verification/core fetch --depth 1 origin "$HERMES_REF"
          git -C .verification/core checkout --detach FETCH_HEAD
          test "$(git -C .verification/core rev-parse HEAD)" = "${HERMES_REF,,}"
      - name: Prepare isolated core, host libraries and test dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m venv .verification/venv
          .verification/venv/bin/python -m pip install -e ./.verification/core 'pytest==9.1.1'
          .verification/venv/bin/python -c 'import subprocess,sys,yaml; deps=yaml.safe_load(open("plugin.yaml"))["python_dependencies"]; subprocess.check_call([sys.executable,"-m","pip","install",*deps])'
          .verification/venv/bin/python -m pip check
      - name: Test the complete public artifact and pinned installation
        shell: bash
        run: |
          set -euo pipefail
          env HOME="$PWD/.verification/home" HERMES_HOME="$PWD/.verification/hermes-home" \
            TMPDIR="$PWD/.verification/tmp" PYTHONPATH="$PWD/tests:$PWD/.verification/core" \
            JIBO_RELEASE_INTEGRATED=1 \
            .verification/venv/bin/python -m pytest tests -q
